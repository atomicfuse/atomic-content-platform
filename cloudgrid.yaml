# CloudGrid deploy config for the atomic-content-platform entity.
# Entity slug (sites-platform-e297) is pinned in .cloudgrid/link.json.
# Reference: https://cloudgrid.io/docs (cloudgrid.yaml spec)

services:

  # ---------------------------------------------------------------------------
  # dashboard — public Next.js UI. Owns all /api/* (Next.js App Router routes)
  # and serves at the entity outlet (https://sites-platform-e297.atomic.cloudgrid.io).
  # ---------------------------------------------------------------------------
  dashboard:
    type: nextjs
    path: /
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GOOGLE_SHEET_ID: "1XE56hNxuhCg4fP8gC59cv2quGp38Im3ASJ1ADj9gzZY"
      CONTENT_AGENT_URL: http://content-pipeline-app
      # IMPORTANT: CloudGrid auto-injects CONTENT_AGGREGATOR_URL as a
      # platform read-only env var pointing to a stale entity URL. Use
      # CONTENT_API_BASE_URL instead — all API routes check it first.
      CONTENT_API_BASE_URL: https://content-aggregator-v2-34cd.atomic.cloudgrid.io
      DOMAINS_DASHBOARD_URL: https://domains-dashboard-53a6.atomic.cloudgrid.io
    # Secrets (via `cloudgrid secrets set KEY=VALUE`):
    #   NEXTAUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
    #   GITHUB_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY,
    #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

  # ---------------------------------------------------------------------------
  # content-pipeline — internal worker (no public path). Reached by the
  # dashboard at http://content-pipeline-app via cluster DNS.
  # Endpoints: GET /health, POST /content-generate, GET /scheduled-publish.
  # ---------------------------------------------------------------------------
  content-pipeline:
    type: node
    lang: typescript
    env:
      NETWORK_REPO: atomicfuse/atomic-labs-network
      # IMPORTANT: CloudGrid auto-injects CONTENT_AGGREGATOR_URL as a
      # platform read-only env var pointing to a stale entity URL. Use
      # CONTENT_API_BASE_URL instead — api-client.ts checks it first.
      CONTENT_API_BASE_URL: https://content-aggregator-v2-34cd.atomic.cloudgrid.io
    # Secrets (via `cloudgrid secrets set KEY=VALUE`):
    #   GITHUB_TOKEN, GEMINI_API_KEY, OPENAI_API_KEY,
    #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (Assets account — for article image uploads)
    #   CLOUDFLARE_API_TOKEN — Workers KV Storage:Read scope; used by Site Checks
    #     sync/tracking checks to read sync-status:<id> and site-config:<id> from
    #     CONFIG_KV. CONFIG_KV namespace IDs are compiled-in constants in
    #     src/lib/cloudflare-accounts.ts and do NOT need env vars.
    #   CLOUDFLARE_ACCOUNT_ID — Assets @ AtomicLabs account ID; also referenced by
    #     r2-upload.ts for article image uploads.
    #   DEV1_CLOUDFLARE_API_TOKEN — optional; only needed if the main token is not
    #     valid on the Dev1 account (financenewsbase/muvizzcom sync+tracking checks).
    #     Without it, those two legacy sites' sync/tracking return `unknown`.
    # REDIS_URL is auto-injected by `requires: redis: private`.
    # MongoDB: `requires: mongodb: private` auto-injects the connection string.
    #   getMongoDb() reads MONGODB_URL, falling back to MONGODB_URI, so either
    #   injected name works without an explicit env: mapping.
    # ANTHROPIC_API_KEY is not needed — handled by the CloudGrid AI Gateway.
    # OPENAI_API_KEY: used by OpenAI text generator (fallback for general
    #   articles) and OpenAI image generator (Tier B fallback). Without it,
    #   the pipeline relies entirely on Claude + Gemini; if either fails,
    #   the source thumbnail is used as a last-resort image fallback.

  # ---------------------------------------------------------------------------
  # scheduled-publisher — hourly cron that pings the pipeline. The pipeline
  # gates execution against scheduler/config.yaml in the network repo, so
  # most ticks are no-ops.
  # ---------------------------------------------------------------------------
  scheduled-publisher:
    type: cron
    schedule: "0 * * * *"
    timezone: EST
    run: http://content-pipeline-app/scheduled-publish

requires:
  - redis: private
  - mongodb: private
