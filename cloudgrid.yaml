services:
  dashboard:
    type: nextjs
    path: /
    env:
      CONTENT_AGENT_URL: http://content-pipeline-app
      NEXTAUTH_URL: https://sites-platform-e297.atomic.cloudgrid.io
      GOOGLE_SHEET_ID: "1XE56hNxuhCg4fP8gC59cv2quGp38Im3ASJ1ADj9gzZY"
    # Secrets (via: cloudgrid secrets set KEY=VALUE):
    #   NEXTAUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY,
    #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, REDIS_URL

  content-pipeline:
    type: node
    path: /api
    build: npm run build
    start: npm start
    lang: typescript
    env:
      NETWORK_REPO: atomicfuse/atomic-labs-network
      CONTENT_AGGREGATOR_URL: https://content-aggregator-cloudgrid.apps.cloudgrid.io
      Secrets: GITHUB_TOKEN, GEMINI_API_KEY, REDIS_URL
    # Note: ANTHROPIC_API_KEY not needed — CloudGrid AI Gateway handles it
    # cron:
      # scheduled-publisher:
      #   schedule: "0 * * * *"
      #   timezone: EST
      #   run: /scheduled-publish
